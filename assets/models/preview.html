<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abo · 3D 头像预览</title>
  <style>
    :root { color-scheme: light dark; --bg:#fafaf7; --ink:#202824; --muted:#66716b; --line:#dce4dd; --accent:#346c52; --soft:#e4f1e8; }
    @media(prefers-color-scheme:dark) { :root { --bg:#1b211e; --ink:#e8eee9; --muted:#b2bdb5; --line:#39413c; --accent:#d2be98; --soft:#33372c; } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:system-ui,'Microsoft YaHei',sans-serif; padding:24px; }
    main { width:min(100%,540px); }
    h1 { font-size:24px; margin:0 0 8px; font-weight:600; }
    p { color:var(--muted); font-size:14px; line-height:1.7; }
    .stage { position:relative; width:100%; aspect-ratio:1; border:1px solid var(--line); border-radius:32px; background:radial-gradient(ellipse at 50% 40%,var(--soft),transparent 75%); overflow:hidden; }
    canvas { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
    canvas:active { cursor:grabbing; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
    button,a { color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font:inherit; font-size:14px; text-decoration:none; cursor:pointer; }
    button:hover,a:hover,button[aria-pressed="true"] { background:var(--soft); border-color:var(--accent); color:var(--accent); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    a { display:inline-block; margin-top:16px; }
    #status { min-height:24px; }
  </style>
</head>
<body>
  <main>
    <h1>Abo 的 3D 头像</h1>
    <p>拖动查看角度，或选择一个动作。</p>
    <div class="stage"><canvas aria-label="可转动的 3D 头像" role="img"></canvas></div>
    <div class="controls" aria-label="头像动作">
      <button data-pose="play">播放问候</button>
      <button data-pose="nod">点头</button>
      <button data-pose="blink">眨眼</button>
      <button data-pose="look">转头</button>
      <button data-pose="wave">左手挥手</button>
      <button data-pose="reset">回正</button>
    </div>
    <p id="status" role="status">加载中…</p>
    <a href="./abo-avatar.glb" download>下载 3D 模型</a>
  </main>
  <script type="module">
    import { createAvatarScene, sampleGreeting, DURATIONS } from '../js/avatar-renderer.js?v=1d7ec25cbe';
    const canvas = document.querySelector('canvas');
    const status = document.querySelector('#status');
    const portrait = new Image();
    portrait.src = '../images/my-avatar.png';
    let animation = 0;
    let viewer;
    let pose = sampleGreeting(0);
    function draw() { viewer.render(pose); }
    try {
      await portrait.decode();
      viewer = createAvatarScene(canvas, portrait);
      new ResizeObserver(() => { viewer.setSize(Math.round(canvas.clientWidth)); draw(); }).observe(canvas);
      status.textContent = '已就绪';
      const times = {nod:.625, blink:.84, look:1.55, wave:3.12, reset:0};
      document.querySelectorAll('[data-pose]').forEach(button => button.addEventListener('click', () => {
        cancelAnimationFrame(animation);
        document.querySelectorAll('[data-pose]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
        if (button.dataset.pose === 'play') {
          const start = performance.now();
          function tick(now) {
            const seconds = (now - start) / 1000;
            pose = sampleGreeting(seconds);
            draw();
            if (seconds < DURATIONS.full) animation = requestAnimationFrame(tick);
            else status.textContent = '播放结束';
          }
          status.textContent = '正在打招呼';
          animation = requestAnimationFrame(tick);
        } else {
          pose = sampleGreeting(times[button.dataset.pose]);
          draw();
          status.textContent = button.textContent;
        }
      }));
      let drag = null;
      canvas.addEventListener('pointerdown', event => {
        cancelAnimationFrame(animation);
        drag = {x:event.clientX, y:event.clientY, yaw:pose.yaw, pitch:pose.pitch};
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (!drag) return;
        pose.yaw = Math.max(-.55, Math.min(.55, drag.yaw + (event.clientX - drag.x) * .005));
        pose.pitch = Math.max(-.3, Math.min(.3, drag.pitch + (event.clientY - drag.y) * .004));
        draw();
      });
      canvas.addEventListener('pointerup', () => { drag = null; });
      canvas.addEventListener('pointercancel', () => { drag = null; });
    } catch {
      status.textContent = '当前浏览器无法预览，请下载模型查看。';
    }
  </script>
</body>
</html>
